<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>lotusflow — under construction</title>
<meta name="description" content="lotusflow — website under construction.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,360;9..144,560&display=swap" rel="stylesheet">
<style>
  :root {
    --pond: #4f8db4;        /* donkerder blauw */
    --pond-deep: #7ab0cf;   /* iets lichter blauw bovenaan */
    --petal: #f0b9c8;       /* lotusroze — ongewijzigd */
    --mist: #23404f;        /* donkere tekst voor leesbaarheid */
    --mist-dim: #5b7583;    /* gedimde donkere tekst */
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(120% 90% at 50% 110%, var(--pond) 0%, var(--pond-deep) 70%);
    color: var(--mist);
    font-family: "Fraunces", Georgia, serif;
    display: grid;
    place-items: center;
    text-align: center;
    padding: 2rem;
  }
  main { max-width: 34rem; }
  .lotus {
    width: clamp(120px, 30vw, 180px);
    height: auto;
    margin: 0 auto 2.2rem;
    display: block;
  }
  .lotus path {
    fill: none;
    stroke: var(--petal);
    stroke-width: 2.5;
    stroke-linecap: round;
  }
  h1 {
    font-weight: 560;
    font-size: clamp(2.6rem, 9vw, 4.2rem);
    letter-spacing: 0.01em;
    line-height: 1.05;
    color: var(--mist);
  }
  h1 .flow { color: var(--petal); font-weight: 360; font-style: italic; }
  p.status {
    margin-top: 1.4rem;
    font-size: clamp(1rem, 3vw, 1.15rem);
    color: var(--mist-dim);
    font-weight: 360;
    letter-spacing: 0.04em;
  }
  /* Eén rustige onthulling bij het laden; uit als de bezoeker minder beweging wil */
  @media (prefers-reduced-motion: no-preference) {
    .lotus path {
      stroke-dasharray: 600;
      stroke-dashoffset: 600;
      animation: draw 2.4s ease-out forwards;
    }
    main > h1, main > p { opacity: 0; animation: appear 1s ease-out forwards; }
    main > h1 { animation-delay: 1.2s; }
    main > p  { animation-delay: 1.7s; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes appear { to { opacity: 1; } }
  }
</style>
</head>
<body>
<main>
  <!-- Lotus in vloeiende lijnen: bloem én "flow" in één beeld -->
  <svg class="lotus" viewBox="0 0 200 140" role="img" aria-label="Line drawing of a lotus flower">
    <path d="M100 118 C 88 96, 88 66, 100 40 C 112 66, 112 96, 100 118 Z"/>
    <path d="M100 118 C 78 108, 62 88, 58 60 C 82 68, 96 88, 100 118 Z"/>
    <path d="M100 118 C 122 108, 138 88, 142 60 C 118 68, 104 88, 100 118 Z"/>
    <path d="M100 118 C 70 118, 46 106, 34 84 C 60 82, 86 96, 100 118 Z"/>
    <path d="M100 118 C 130 118, 154 106, 166 84 C 140 82, 114 96, 100 118 Z"/>
    <path d="M28 128 C 55 122, 80 126, 100 128 C 120 130, 145 126, 172 121"/>
  </svg>
  <h1>lotus<span class="flow">flow</span></h1>
  <p class="status">Website under construction</p>
</main>
</body>
</html>
